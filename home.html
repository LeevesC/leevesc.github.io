<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ALEX RIVERA | Creative Director</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- TopNavBar -->
    <nav class="nav-bar">
      <div class="nav-container">
        <div class="nav-logo">LEE ZHOU</div>
        <div class="nav-links">
          <a class="nav-link" href="#">Gallery</a>
          <a class="nav-link" href="#">Case Studies</a>
          <a class="nav-link" href="#">About</a>
          <a class="nav-link" href="#">Contact</a>
        </div>
        <button class="nav-menu-btn">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Canvas -->
    <main class="hero-section">
      <!-- Animated Background Elements -->
      <div class="hero-bg">
        <div class="hero-blob-1"></div>
        <div class="hero-blob-2"></div>
        <div class="hero-blob-3"></div>
      </div>

      <!-- Hero Branding Section -->
      <div class="hero-content">
        <!-- Circular Avatar -->
        <div class="avatar-wrapper">
          <div class="avatar-img-container">
            <img
              alt="Alex Rivera"
              class="avatar-img"
              data-alt="Close-up portrait of a thoughtful creative director with short dark hair and a minimalist black turtleneck in a soft-lit studio setting"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1bhiuXM0tid04MjRvy8m6383NMgpnT6ikzThFwKsAeen8-WBDX3huZLRnJ63RhMk0jbpJsPkpwexl_ftOwf67HLseqXU0GY9c-fAtRi4mq4dmMRlmgqpqfBi7vC55vZDDatxq3hEyPGeR3_fwVHcEbtb1m_TLf9u3Qeyq2FDTt5CNtGlZBATb8mEpZCi4DiXQ-Hc98KN144djhGrRHZzVz3gAZw_phOZuoIV7IdGEphvfiKC6vvCpjDkYJ16iN62oPsGKGrqbx9l3"
            />
          </div>
          <!-- Floating Decorative Element -->
          <div class="avatar-badge">
            <span class="material-symbols-outlined">star</span>
          </div>
        </div>

        <!-- Identity Text -->
        <div class="hero-text">
          <h1 class="hero-title">ALEX RIVERA</h1>
          <p class="hero-subtitle">CREATIVE DIRECTOR</p>
          <div class="hero-cta">
            <a class="btn-primary" href="#">
              View Portfolio
              <span class="material-symbols-outlined">arrow_forward</span>
            </a>
            <a class="btn-secondary" href="#">Get In Touch</a>
          </div>
        </div>
      </div>

      <!-- Scroll Indicator -->
      <div class="scroll-indicator">
        <span class="scroll-label">Scroll to explore</span>
        <div class="scroll-line">
          <div class="scroll-line-fill"></div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
